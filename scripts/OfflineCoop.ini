; ============================================================
; Offline Coop v1.9 — DEFINITIVE FIXED CONFIG
; ============================================================
; Помести этот файл в <GTA V>\scripts\ рядом с OfflineCoop.dll
; Все значения ниже подобраны под нативное управление GTA V и убирают
; дёрганье камеры, мёртвые зоны и невозможность стрелять без прицела.
; ============================================================

[Input]
CONTROLLER_INDEX=1          ; 1 = второй подключённый джойстик (по умолчанию).
                             ; ЕСЛИ ДЖОЙСТИК УПРАВЛЯЕТ И ПЕРВЫМ И ВТОРЫМ ИГРОКОМ —
                             ; ПОМЕНЯЙ ЭТО ЗНАЧЕНИЕ НА 0 И НАЖМИ INSERT В ИГРЕ.
DEADZONE=7849
DEADZONE_TRIGGER=30
RESPONSE_CURVE=2.0
FILTER_SMOOTHING=0.35

[Aiming]
AimMode=LockOn              ; Автозахват цели как в обычной GTA (удобнее с джойстика)
AimingRotationSpeedMultiplier=1.1
WEAPON_HOLD_THRESHOLD=220
AIM_YAW_THRESHOLD=0.025
AIM_PITCH_THRESHOLD=0.025
FREE_AIM_YAW_SPEED=4.5
FREE_AIM_PITCH_SPEED=3.2
FREE_AIM_PITCH_MIN=-55.0
FREE_AIM_PITCH_MAX=55.0
FREE_AIM_DISTANCE=140.0
MAX_TARGET_DISTANCE=220.0
SHOOT_WITHOUT_AIM=true      ; СТРЕЛЬБА ОТ БЕДРА БЕЗ ПРИЦЕЛИВАНИЯ (исправление бага)

[Movement]
CAM_ROTATE_SPEED=3.8
CAM_PITCH_SPEED=2.6
CAM_PITCH_MIN=-65.0
CAM_PITCH_MAX=55.0
MoveSpeed=1.0
RunSpeed=1.0
JUMP_BLOCK_DURATION=250
JUMP_COOLDOWN=600
TransitionDelay=700

[Driving]
MIN_MOMENTUM_SPEED=0.5
MAX_WHEELIE_PITCH=0.6
MAX_STOPPIE_PITCH=0.6
MAX_CAR_PITCH_AIR=0.5
PITCH_SMOOTHING=0.25
Alternative=false
planePhysicsSpeed=1.0

[General]
SpawnKey=N
SplitKey=K
MenuKey=PageUp
Invincibility=true          ; Убирает баг мгновенной смерти от падений у P2
AutoTeleport=true
AntiClip=true
TeleportKey=Subtract        ; Numpad "-" — телепорт P2 к P1 (как в изначальном моде)
